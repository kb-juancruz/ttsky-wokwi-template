# Tiny Tapeout project information (Wokwi project)
project:
  wokwi_id:     477138947851131905       # Set this to the ID of your Wokwi project (the number from the project's URL)
  title:        "LED loop"      # Project title
  author:       "Juan Cruz"      # Your name
  discord:      "kenobi_360"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Turns on 8 LEDs sequentially and in a loop."      # One line description of what your project does
  language:     "Wokwi" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2


# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "SEL"      # Selector de modo del mux + bit 0 del DIP
  ui[1]: "SW1"           # Bit 1 del DIP switch
  ui[2]: "SW2"           # Bit 2 del DIP switch
  ui[3]: "SW3"           # Bit 3 del DIP switch
  ui[4]: "SW4"           # Bit 4 del DIP switch
  ui[5]: "SW5"           # Bit 5 del DIP switch
  ui[6]: "SW6"           # Bit 6 del DIP switch
  ui[7]: "SW7"           # Bit 7 del DIP switch

  # Outputs
  uo[0]: "LED0"          # LED / segmento A del display
  uo[1]: "LED1"          # LED / segmento B del display
  uo[2]: "LED2"          # LED / segmento C del display
  uo[3]: "LED3"          # LED / segmento D del display
  uo[4]: "LED4"          # LED / segmento E del display
  uo[5]: "LED5"          # LED / segmento F del display
  uo[6]: "LED6"          # LED / segmento G del display
  uo[7]: "LED7"          # LED / segmento DP del display

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

